name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-release an already-tagged version'
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Pinned cargo-dist version. Keep in sync with dist-workspace.toml's
  # cargo-dist-version.
  DIST_VERSION: 0.32.0

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      rust-version: ${{ steps.rust-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read and validate VERSION
        id: version
        run: |
          V=$(cat VERSION)
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION '$V' is not valid semver (X.Y.Z)"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Read Rust toolchain version from mise.toml
        id: rust-version
        run: |
          VERSION=$(grep -m1 '^rust' mise.toml | sed -E 's/rust *= *"([^"]+)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check three-way version consistency
        run: |
          V="${{ steps.version.outputs.version }}"
          CARGO_V=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          PLUGIN_V=$(python3 -c "import json;print(json.load(open('plugin/.claude-plugin/plugin.json'))['version'])")
          [ "$V" = "$CARGO_V" ] && [ "$V" = "$PLUGIN_V" ] || { echo "version drift: VERSION=$V Cargo.toml=$CARGO_V plugin.json=$PLUGIN_V"; exit 1; }

      - name: Check DIST_VERSION matches dist-workspace.toml
        run: |
          WORKFLOW_V="${{ env.DIST_VERSION }}"
          CONFIG_V=$(grep -m1 '^cargo-dist-version' dist-workspace.toml | sed -E 's/cargo-dist-version *= *"([^"]+)"/\1/')
          [ "$WORKFLOW_V" = "$CONFIG_V" ] || { echo "dist version drift: workflow DIST_VERSION=$WORKFLOW_V dist-workspace.toml cargo-dist-version=$CONFIG_V"; exit 1; }

      - name: Check tag does not already exist
        if: github.event.inputs.force != 'true'
        run: |
          git fetch --tags
          if git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null; then
            echo "Tag v${{ steps.version.outputs.version }} already exists (use workflow_dispatch with force=true to re-release)"
            exit 1
          fi

      - name: Check CHANGELOG.md has an entry for this version
        run: |
          grep -qF "## [${{ steps.version.outputs.version }}]" CHANGELOG.md || {
            echo "CHANGELOG.md is missing a '## [${{ steps.version.outputs.version }}]' entry"
            exit 1
          }

  verify:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.gate.outputs.rust-version }}

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test

  build:
    needs: [gate, verify]
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.gate.outputs.rust-version }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install dist
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf \"https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh\" | sh"

      - name: Build local artifacts
        run: |
          dist build --tag=v${{ needs.gate.outputs.version }} --output-format=json --artifacts=local --target=${{ matrix.target }} > dist-manifest.json
          cp dist-manifest.json target/distrib/${{ matrix.target }}-dist-manifest.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rrecall-${{ matrix.target }}
          path: |
            target/distrib/*.tar.xz
            target/distrib/*.tar.xz.sha256
            target/distrib/*-dist-manifest.json

  publish:
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: target/distrib
          merge-multiple: true

      - name: Install dist
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf \"https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh\" | sh"

      - name: Build global artifacts (installer.sh)
        run: dist build --tag=v${{ needs.gate.outputs.version }} --output-format=json --artifacts=global > dist-manifest.json

      - name: Remove internal dist manifests from release assets
        run: rm -f target/distrib/*-dist-manifest.json

      - name: Create and push tag
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$FORCE" = "true" ]; then
            git tag -f "v${VERSION}"
            git push --force origin "v${VERSION}"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            target/distrib/*.tar.xz
            target/distrib/rrecall-installer.sh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.gate.outputs.version }}
          generate_release_notes: true
          files: target/distrib/*
